<style>
:root{color-scheme:light;--bg:#f3f8ff;--card:#fff;--tx:#2f3a56;--ac:#5b8def;--ok:#43c279;--okbg:#dcf6e6;--no:#ef6b6b;--nobg:#ffe3e3;--mut:#7a86a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#eaf3ff,#fff7fb) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--mut);margin:0 0 22px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 16px rgba(80,110,180,.15)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.menu button{display:block;width:100%;margin:0 0 14px;padding:20px;border-radius:18px;background:#e8f0ff;color:var(--tx);border:2px solid #cfe0ff;font-size:20px;font-weight:700;text-align:left}
.menu small{display:block;font-weight:400;opacity:.9;font-size:14px;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);margin-bottom:10px;font-size:16px}
.back{background:none;color:var(--ac);font-weight:700;padding:6px 0}
.bar{height:8px;background:#dfe8fa;border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.q{font-size:22px;font-weight:700;text-align:center;margin:8px 0 18px;line-height:1.35}
.hint{text-align:center;color:var(--mut);font-size:15px;margin-top:-10px;margin-bottom:14px}
.opt{display:block;width:100%;margin:0 0 10px;padding:16px;border-radius:14px;background:#eef3ff;font-size:19px;text-align:center;border:3px solid transparent}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt .s{color:var(--no);text-decoration:underline;font-weight:800}
.opt.ok .s{color:#1e9e52}
.fb{margin:14px 0 6px;padding:14px;border-radius:14px;font-size:17px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb b.t{display:block;font-size:20px;margin-bottom:4px}
.rhyme{font-style:italic;margin-top:6px}
.next,.big{display:block;width:100%;padding:16px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;font-size:19px;margin-top:12px}
.big.alt{background:transparent;color:var(--ac);border:3px solid var(--ac)}
.res{text-align:center}
.res .n{font-size:56px;font-weight:800;color:var(--ac)}
</style>
</head>

  const g=GAMES[k],n=g.data.length,sec=SECTIONS.find(s=>s.games.includes(k));
  const opts=[5,10,20,30].filter(x=>x<n);
  app.innerHTML='<div class="top"><button class="back" id="bk">← Назад</button></div><h1>'+g.icon+' '+g.name+'</h1><p class="sub">Скільки питань?</p><div class="menu">'+opts.map(x=>'<button data-c="'+x+'">'+x+' питань</button>').join("")+'<button data-c="'+n+'">Усі ('+n+')</button></div>';
  document.getElementById("bk").onclick=()=>sec?section(sec.id):menu();
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>start(k,shuffle(g.data).slice(0,+b.dataset.c)));
}
function start(k,items){
  st={k,items:shuffle(items),i:0,score:0,wrong:[],done:false};
  question();
}
function question(){
  const it=st.items[st.i],g=GAMES[st.k],n=st.items.length;
  const opts=it.tf?["Правильно","Неправильно"]:shuffle([it.ok,...it.bad]);
  const gk=it._g||st.k;const isS=gk==="stress";
  const q=isS?esc(it.ok.toLowerCase()):esc(it.q);
  app.innerHTML='<div class="top"><button class="back" id="bk">← Меню</button><span>'+st.i+' з '+n+' · ⭐ '+st.score+'</span></div>'+
  '<div class="bar"><i style="width:'+(st.i/n*100)+'%"></i></div><div class="card"><div class="q">'+q+'</div>'+
  (isS?'<div class="hint">Де наголос?</div>':(it.tf?'<div class="hint">Чи правильно вжито?</div>':''))+
  opts.map((o,j)=>'<button class="opt" data-o="'+j+'">'+(isS?stressHtml(o):esc(o))+'</button>').join("")+'<div id="fb"></div></div>';
  document.getElementById("bk").onclick=menu;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach((b,j)=>b.onclick=()=>{
    const right=opts[j]===it.ok;
    btns.forEach((x,m)=>{x.disabled=true;if(opts[m]===it.ok)x.classList.add("ok")});
    if(!right)b.classList.add("no");
    if(right){st.score++;unmark(gk,it)}else{st.wrong.push(Object.assign({_g:gk},it));mark(gk,it)}
    const extra=isS?(it.r?'<div class="rhyme">🎵 '+stressHtml(it.r)+'</div>':''):'<div>'+esc(it.e||("«"+(it.q||it.ok)+"» — "+it.ok+"."))+'</div>';
    const last=st.i===n-1;
    document.getElementById("fb").innerHTML='<div class="fb '+(right?"ok":"no")+'"><b class="t">'+(right?"✅ Правильно!":"❌ Неправильно")+'</b>'+
      (isS&&!right?'<div>Правильно: <b>'+stressHtml(it.ok)+'</b></div>':'')+extra+'</div><button class="next" id="nx">'+(last?"Результат":"Далі →")+'</button>';
    document.getElementById("nx").onclick=()=>{st.i++;last?finish():question()};
  });
}
function finish(){
  const n=st.items.length,p=Math.round(st.score/n*100);
  const msg=p===100?"Бездоганно! 🏆":p>=70?"Чудово! 👏":p>=40?"Непогано, але є що повторити 💪":"Не здавайся, спробуй ще! 🌱";
  app.innerHTML='<div class="card res"><h1>Результат</h1><div class="n">'+st.score+' з '+n+'</div><p>'+msg+'</p>'+
  '<button class="big" id="a">Пройти ще раз</button>'+
  (st.wrong.length?'<button class="big alt" id="w">Повторити лише помилки ('+st.wrong.length+')</button>':'')+
  '<button class="big alt" id="m">До меню</button></div>';
  document.getElementById("a").onclick=()=>st.k==="mistakes"?start(st.k,mistakeItems()):pick(st.k);
  if(st.wrong.length){const w=st.wrong.slice(),k=st.k;document.getElementById("w").onclick=()=>start(k,w)}
  document.getElementById("m").onclick=menu;
}
menu();
</script>
